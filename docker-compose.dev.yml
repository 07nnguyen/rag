services:
  qdrant:
    image: qdrant/qdrant:v1.9.1
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  rag-service:
    build: .
    container_name: rag-service
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333

  ingest:
    build: .
    container_name: rag-ingest
    depends_on: [ qdrant ]
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    volumes:
      - ./data:/data
      - ./scripts:/scripts
    entrypoint: ["python", "/scripts/ingest.py"]

volumes:
  qdrant_data:
