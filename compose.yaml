services:
  qdrant:
    image: qdrant/qdrant:v1.9.1
    restart: unless-stopped
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]

  redis:
    image: redis:7
    restart: unless-stopped

  # Giữ litellm nếu sau này muốn route OpenAI/Azure/Mistral (không bắt buộc khi dùng Ollama)
  litellm:
    image: ghcr.io/berriai/litellm:main
    restart: unless-stopped
    ports: ["4000:4000"]
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-dummy}

  langfuse:
    image: langfuse/langfuse:latest
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/langfuse
      - NEXTAUTH_SECRET=devsecret
    depends_on: [postgres]

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=langfuse
    volumes: ["pg_data:/var/lib/postgresql/data"]

  # LLM miễn phí: Ollama
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports: ["11434:11434"]
    volumes: ["ollama_data:/root/.ollama"]

  rag-service:
    image: ghcr.io/07nnguyen/rag:latest
    restart: unless-stopped
    depends_on: [qdrant, redis]
    ports: ["8000:8000"]
    environment:
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=docs
      - TOP_K=6
      - EMBED_MODEL=mixedbread-ai/mxbai-embed-large-v1


  ingest:
    build:
      context: .
      dockerfile: Dockerfile.ingest
    depends_on: [qdrant]
    entrypoint: ["python", "/scripts/ingest.py"]
    environment:
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-docs}
      - EMBED_MODEL=${EMBED_MODEL:-mixedbread-ai/mxbai-embed-large-v1}
    volumes:
      - ./data:/data
      - ./scripts:/scripts

  # UI để chat trực tiếp với LLM (và có thể gọi RAG bằng cách bạn tích hợp sau)
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    depends_on: [ollama]
    ports: ["8081:8080"]
    environment:
      - OPENAI_API_BASE_URL=http://ollama:11434
      - OPENAI_API_KEY=dummy

volumes:
  qdrant_data:
  pg_data:
  ollama_data:
